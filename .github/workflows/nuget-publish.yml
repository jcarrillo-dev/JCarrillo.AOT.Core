name: Publicar Paquetes en NuGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del paquete (ej: 1.1.5). Si se omite, se deduce del tag.'
        required: false
        type: string

jobs:
  publish:
    name: Empaquetar y Publicar en NuGet.org
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar .NET SDKs (8.0, 9.0 y 10.0)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
        cache: true

    - name: Determinar versión
      id: get_version
      shell: bash
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          VER="${{ inputs.version }}"
        elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          VER="${GITHUB_REF_NAME#v}"
        elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          VER="${GITHUB_REF_NAME}"
        else
          echo "No se especificó tag ni versión manual en workflow_dispatch." >&2
          exit 1
        fi
        echo "VERSION=$VER" >> $GITHUB_ENV
        echo "version=$VER" >> $GITHUB_OUTPUT

    - name: Ejecutar pruebas previas al empaquetado (Pre-publish Gate)
      run: dotnet test ./JCarrillo.AOT.Core.Tests/JCarrillo.AOT.Core.Tests.csproj -c Release

    - name: Restaurar dependencias
      run: dotnet restore ./JCarrillo.AOT.Core/JCarrillo.AOT.Core.csproj -p:Version=${{ env.VERSION }}

    - name: Empaquetar Librerías y Símbolos
      run: dotnet pack ./JCarrillo.AOT.Core/JCarrillo.AOT.Core.csproj -c Release --no-restore -o ./artifacts -p:Version=${{ env.VERSION }}

    - name: Archivar artefactos de NuGet (.nupkg y .snupkg)
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages-${{ env.VERSION }}
        path: ./artifacts/*
        if-no-files-found: error

    - name: NuGet login (OIDC -> temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: JCarrillo

    - name: Subir paquetes a NuGet
      run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate